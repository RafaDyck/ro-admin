name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests (no database required)
        run: python -m pytest -v -m "not integration"
      - name: OpenAPI document generates
        run: python scripts/dump_openapi.py > /dev/null
      - name: No dead code
        # Validated against the predecessor's backend: finds all 13 of its
        # unreachable executor methods, and reports this repo clean.
        run: python scripts/check_dead_code.py
      - name: No bundled game data
        # The predecessor accumulated 285 hardcoded item names in a React
        # component while the database held 28,525. It arrived one literal at a
        # time, each defensible alone -- so this is a gate, not a guideline.
        run: python scripts/check_no_game_data.py
      - name: Skill matches the API
        # The skill is instructions an agent executes. A renamed query
        # parameter otherwise makes it silently wrong, and nothing reads it
        # before it acts.
        run: python scripts/check_skill_matches_api.py
      - name: No HTML parsing in the web UI
        # Player-chosen names are rendered by the UI. One of them parsed as
        # HTML runs inside an admin's session. js/dom.js builds only text.
        run: python scripts/check_no_innerhtml.py
      - name: The wheel ships the web UI
        # Served from the source tree in development, so a file missing from
        # package data only shows up as a blank page after `pip install`.
        run: |
          pip wheel . --no-deps -w dist
          python scripts/check_wheel_ships_web.py dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Web UI unit tests
        # Node is a development dependency only. Nothing it installs ships:
        # the UI is plain files, and ro-admin runs with Python alone.
        run: npm ci && npm test
