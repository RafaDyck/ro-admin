[project]
name = "ro-admin"
version = "0.1.0"
description = "A modern administration API for rAthena Ragnarok Online servers"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Dyck" }]
keywords = ["ragnarok", "rathena", "admin", "api", "game-server"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymysql>=1.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
markers = ["integration: requires a running rAthena database"]
testpaths = ["tests"]
pythonpath = ["src"]
